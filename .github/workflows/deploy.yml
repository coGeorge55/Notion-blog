name: Deploy to GitHub Pages

于:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build and Export
        env:
          # 【修复点1】强制设置子路径环境变量，确保构建时知道自己在子目录
          NEXT_PUBLIC_SUB_PATH: '/Notion-blog'
          # 读取 Secrets
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          npm run build
          npm run export
          # 【修复点2】生成 .nojekyll 文件，防止 GitHub 忽略 _next 资源文件夹
          touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
